<!DOCTYPE html>
<html>
<head>
    <h1>Label</h1>
    <body>
        <form>
            <label for="firstname">First Name:</label>
            <input type="text" name="firstname" id="firstname"> 
        </form>
        
        <br>
        
        <form>
            <label for="lastname">Last Name:</label>
            <input type="text" name="lastname" id="lastname">
        </form>

        <br>

        <form>
            <label for="phonenumber">Phone Number:</label>
            <input type="tel" id="phone" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}">
        </form>

        <br>

         <form>
            <label for="password">Password:</label>
            <input type="text" name="password" id="password">
        </form>
    </body>

<h2>Select Your Characters</h2>

    <form>
        <input type="checkbox" id="char1" name="char1" value="Amber">
        <label for="char1">Mikko</label><br>

        <input type="checkbox" id="char2" name="char2" value="Kaeya">
        <label for="char2">Edz</label><br>

        <input type="checkbox" id="char3" name="char3" value="Lumine">
        <label for="char3">Gelliel</label><br><br>
    </form>

<h3>Submit and Reset</h3>

        <form>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name">
        <br>
        <br>
            <input type="submit" value="Submit"> 
        </form>
        <br>
            <input type="submit" value="Reset"> 
        </form>


</head>
</html>
